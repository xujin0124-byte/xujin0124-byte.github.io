<script id="chapters" type="application/json">[{"chapter":1,"title":"社会主义基本经济制度","part":1,"questions":[{"id":"e1","source":"经典例题 1 · 书页 1–2","q":"关于社会主义基本经济制度的内涵，描述正确的是（ ）。","o":["私有制为主体","市场经济体制","按劳分配为主体，其他分配方式为辅","公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制"],"a":"D","why":"社会主义基本经济制度包括所有制、收入分配和经济体制三个方面，D 项完整表述了这三方面。"},{"id":"s1","source":"同步训练 · 单选 1 · 书页 2；答案书页 3","q":"我国社会主义经济制度的基础是（ ）。","o":["社会主义公有制","全民所有制","国有经济","集体所有制"],"a":"A","why":"中华人民共和国社会主义经济制度的基础是生产资料的社会主义公有制。"},{"id":"m1","source":"同步训练 · 多选 1 · 书页 3；答案书页 4","q":"经济制度体现在（ ）方面。","o":["所有制","收入分配制度","资源配置的方式","政府与市场的关系","社会管理"],"a":"ABC","why":"经济制度主要体现在三个方面：所有制或产权制度、收入分配制度、资源配置的方式。"},{"id":"e2","source":"经典例题 2 · 书页 2","q":"生产资料公有制包括的形式是（ ）。","o":["全民所有制","集体所有制","个体经济","私营经济","外资经济"],"a":"AB","why":"生产资料公有制是全体社会成员或部分社会成员共同占有生产资料的所有制形式，包括全民所有制和集体所有制。"},{"id":"s2","source":"同步训练 · 单选 2 · 书页 2；答案书页 3","q":"我国实行的收入分配制度是（ ）。","o":["按投资分配","按生产要素分配","按劳分配","按劳分配为主体、多种分配方式并存"],"a":"D","why":"我国实行以按劳分配为主体、多种分配方式并存的收入分配制度。"},{"id":"m2","source":"同步训练 · 多选 2 · 书页 3；答案书页 4","q":"社会主义所有制中公有制的主体地位主要体现在（ ）方面。","o":["深化国有企业改革","公有资产在社会总资产中占优势地位","国有经济在重要行业和关键领域对经济发展起主导作用","满足全体人民的共同需要","国有资产监管体制"],"a":"BCD","why":"公有制主体地位体现为：公有资产在社会总资产中占优势；国有经济控制国民经济命脉，对经济发展起主导作用；满足全体人民的共同需要，保障共同利益，实现共同富裕。"},{"id":"e3","source":"经典例题 3 · 书页 2","q":"按劳分配的内涵包括（ ）。","o":["巩固公有制经济的主体地位","等量劳动领取等量报酬","完善市场秩序","增加劳动者报酬","各尽所能"],"a":"BE","why":"按劳分配包含两方面：各尽所能，即有劳动能力的社会成员都必须参加社会劳动；等量劳动领取等量报酬。"},{"id":"s3","source":"同步训练 · 单选 3 · 书页 3","q":"社会对其所拥有的各种资源在其不同用途之间的分配，称为（ ）。","o":["资源配置","资源配置制度","资源配置理论","资源配置方式"],"a":"A","why":"资源配置是指一个地区、一个国家，甚至全球范围内，社会对其所拥有的各种资源在其不同用途之间的分配。"},{"id":"m3","source":"同步训练 · 多选 3 · 书页 3；答案书页 4","q":"发挥国有经济的主导作用，需要加强推进下列工作（ ）。","o":["深化国有企业改革","公有资产在社会总资产中占优势地位","推进国有经济布局优化和结构调整","实现共同富裕","形成以管资本为主的国有资产监管体制"],"a":"ACE","why":"需要推进国有经济布局优化和结构调整，深化国有企业改革，形成以管资本为主的国有资产监管体制。"},{"id":"e4","source":"经典例题 4 · 书页 2","q":"社会主义市场经济体制产生和存在的基础是（ ）。","o":["价格由市场决定","社会经济资源由市场配置","社会主义公有制","市场经济与社会主义制度的结合"],"a":"D","why":"市场经济与社会主义制度的结合，是社会主义市场经济体制产生和存在的基础。"},{"id":"m4","source":"同步训练 · 多选 4 · 书页 3；答案书页 4","q":"农村基本经营制度的核心内容包括（ ）。","o":["坚持农村土地农民集体所有","坚持家庭联产承包经营的基础性地位","坚持稳定土地承包关系","坚持共同富裕","坚持乡村振兴"],"a":"ABC","why":"核心内容包括：坚持农村土地农民集体所有；坚持家庭联产承包经营的基础性地位；坚持稳定土地承包关系。分别对应制度基础、经营基础和维护承包经营权的关键。"},{"id":"m5","source":"同步训练 · 多选 5 · 书页 3；答案书页 4","q":"关于市场在资源配置中起决定性作用的表述，正确的是（ ）。","o":["通过价格机制、供求机制、竞争机制等市场机制对资源配置发挥决定性作用","社会经济资源主要由政府的计划配置","价格主要由政府决定","社会经济资源主要是由市场配置","价格主要由市场决定"],"a":"ADE","why":"社会经济资源主要由市场配置，价格主要由市场决定。市场通过价格机制、供求机制、竞争机制等对资源配置发挥决定性作用。"}]},{"chapter":2,"title":"市场需求、供给与均衡价格","part":1,"questions":[{"q":"某月内,甲商品的替代品和互补品的价格同时下降,引起的甲商品的需求变动量分别 为 80 单位和 50 单位,则在这类商品价格变动的共同作用下,该月甲商品的需求量变动情况是 人 )。 ，","o":["增加 30 单位","减少 30 单位","增加 130 单位","减少 130 单位"],"a":"B","why":"”此题考查替代品和互补品的价格与商品需求量的关系。替代品的价格与商品需求 量同方向变化,互补品的价格与商品需求量反方向变化,即甲商品的替代品价格下降,则甲商 品的需求量减少( -80 单位 ) ; 甲商品的互补品价格下降,则甲商品的需求量增加 (+50 单位 )。 因此,在这类商品价格变动的共同作用下 ,该月甲商品的需求量变动情况是: -80+50=-30(单 位 ),即减少 30 单位。","id":"c2-s1","source":"第2章 · 同步训练 · 单选 1"},{"q":"以下( ) 能够导致某种商品的需求曲线向右平移。","o":["该商品自身的价格上升","替代品价格下降","收入减少","消费者偏好增强 -"],"a":"D","why":"”此题考查需求曲线变动的概念。需求曲线向右移动 ,说明需求量增加,只有选项 D 会导致需求量增加。选项 A 不会导致需求曲线移动 ,选项 B、C 导致需求量减少。","id":"c2-s2","source":"第2章 · 同步训练 · 单选 2"},{"q":"以下( ) 能够导致某种商品的供给曲线向左平移。","o":["该商品价格上升","生产技术提高","生产成本增加","消费者偏好增强"],"a":"C","why":"”此题考查供给曲线变动的概念。供给曲线向左平移 ,说明供给量减少,选项 C 成本 增加会导致生产减少。选项 A 导致的是供给数量变动,不会平移; 选项 B 会导致供给曲线向 右平移; 选项 D 会导致需求曲线变动。","id":"c2-s3","source":"第2章 · 同步训练 · 单选 3"},{"q":"当市场中猪肉的价格上涨幅度过大,有可能影响城镇居民的生活水平时,政府一般可以 采取的干预方式是( )。","o":["限制进口","实施最高限价","实施保护价格","增加政府库存"],"a":"B","why":"”此题考查最高限价的概念。当某种商 四析于术臣寺和 可能影响居民的基本生 活需要时,政府可以采取最高限价进行干预。","id":"c2-s4","source":"第2章 · 同步训练 · 单选 4"},{"q":"已知某种商品的需求价格弹性系数是 0.5, 当价格为每台 32 元时,其销售量为 1 000 台。如果这种商品价格下降 10% ,在其他因素不变的条件下 ,其销售量是人 )台。","o":["950","1000","1050","1 100"],"a":"C","why":"”此题考查需求价格弹性系数的计算。 需求价格弹性系数 0.5= 需求量变动率 / 价格 变动率 10% ,需求量变动率 =<5% ,增加 5% 后的销售量 =1 000 x ( 1+5% ) =1 050( 台 )。","id":"c2-s5","source":"第2章 · 同步训练 · 单选 5"},{"q":"某城市决定从 2019 年.8 月 1 日起,把辖区内一著名风景区门票价格从 32 元提高到 40 元,已知该风景区 2018年 8 月的游客为 10 万人次,2019年8 月的游客比 2018 年.8 月 减少了 12% ,则以驳弹性公式计算的该风景区旅游的需求价格弹性系数是( )。","o":["0.57","0.48","1.1 :","2.08"],"a":"A","why":"”此题考查需求价格弹性系数的红弹性计算。2019 年 8 月游客量为 100 000x (1- 12% )=88 000 人次,平均需求量 =( 88 000+100 000 ) :2=94 000,弧弹性下需求量变动率 = (88 000-100 000 ) = 94 000 = -12.766% ,平均价格 =(40+32 ) : 2=36, 价格变动率 =(40-32 ) : 36=8: 36 ~ 22.22% ,弧弹性下需求价格弹性系数 =-12.766% : 22.22% ~ -0.57。由于需求价 格弹性系数始终是负数,所以可以用绝对值直接表达。","id":"c2-s6","source":"第2章 · 同步训练 · 单选 6"},{"q":"企业之所以能够实行薄利多销策略,以下符合其理论基础的是( )。","o":["商品的需求价格弹性系数大于 1 时 ,抬高价格使得销售收入增加 :","商品的需求价格弹性系数小于 1 时 ,抬高价格使得销售收入增加","商品的需求价格弹性系数大于 1 时,降低价格使得销售收入增加","商品的需求价格弹性系数小于 工时,降低价格使得销售收入增加"],"a":"C","why":"”此题考查需求价格弹性和总销售收入的关系。 企业对于需求富有弹性 即需求弹 性系数大于 1 ) 的商品适用薄利多销的方法。","id":"c2-s7","source":"第2章 · 同步训练 · 单选 7"},{"q":"以下四种弹性中,( )是确定两种商品是否具有替代关系或互补关系 的标准。","o":["需求价格弹性","需求交叉弹性","供给价格弹性","需求收入弹性"],"a":"B","why":"”此题考查需求交叉弹性的概念。需求交叉弹性大小是确定两种商品是否具有替代 关系或互补关系的标准。","id":"c2-s8","source":"第2章 · 同步训练 · 单选 8"},{"q":"假设一定时期内 消费者的个人收入增加了 , 由此导致消费者对某商品的需求反而减少 了,这在一定程度上可以说明该商品属于( )。","o":["高档品","边际商品","低档品","必需品"],"a":"C","why":"”此题考查需求收入弹性的概念。需求收入弹性为负值的商品称为低档品。随着收 人水平的提高,低档品的需求量反而减少。","id":"c2-s9","source":"第2章 · 同步训练 · 单选 9"},{"q":"关于影响需求价格弹性的因素 下列表述错误的是( )。","o":["一种商品有许多相近的替代品,则需求价格弹性大","时间越短 ,商品的需求弹性越大","生活基本必需品的需求价格弹性小","一种商品的用途越多,它的需求弹性就越大"],"a":"B","why":"”此题考查影响需求价格弹性的因素。时间越短 ,商品的需求弹性越小。","id":"c2-s10","source":"第2章 · 同步训练 · 单选 10"},{"q":"下列情况中属于需求高弹性的是( )","o":["价格下降 1% ,需求量增加 2%","价格上升 2% ,需求量下降 2%","价格下降 5% ,需求量增加 3%","价格下降 3% ,需求量下降 4%"],"a":"A","why":"”此题考查需求价格弹性的具体应用。需求价格弹性是指需求量对价格变动的反 应程度,是需求量变动百分比与价格变动百分比的比率,分为三种情况: @当需求价格弹性系 数大于 1 时,称为需求富有弹性或高弹性; @当需求价格弹性系数等于 1 时 ,称为需求单一弹 性; @当需求价格弹性系数小于 1 时 ,称为需求缺乏弹性或低弹性。由此可知,选项A、B、C 三种情况分别是需求高弹性需求单一弹性和需求低弹性,选项 D 中的情况一般不存在,因为 价格与需求量一般成反比。","id":"c2-s11","source":"第2章 · 同步训练 · 单选 11"},{"q":"政府为了保护农业生产者利益,在必要时对某些农产品可以采取的价格干预措施是 ， )。","o":["调控均衡价格","规定最高限价","规定保护价格","降低农业生产资料价格 (二)"],"a":"C","why":"”此题考查保护价格分析。保护价格也叫支持价格或最低限价 ,就是由政府规定一 个具 const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){persist=false}}
function home(){const parts=[1,2,3,4,5,6].map(part=>`<section class="part"><h3>第${['','一','二','三','四','五','六'][part]}部分 · ${partNames[part]}</h3><div class="chapter-grid">${chapters.filter(c=>c.part===part).map(c=>{const done=c.questions.filter(q=>saved.correct.includes(q.id)).length,pct=c.questions.length?Math.round(done/c.questions.length*100):0;return `<button class="chapter" data-chapter="${c.chapter}"><span class="num">${c.chapter}</span><span><b>${esc(c.title)}</b><small>${c.questions.length} 题 · 已掌握 ${done}</small><span class="progress-line"><i style="width:${pct}%"></i></span></span></button>`}).join('')}</div></section>`).join('');app.innerHTML=`<section class="card home-card"><div class="section-title"><h2>选择章节</h2><span class="pill">共 ${allBank.length} 题</span></div><div class="stats"><div class="stat"><strong>37</strong><span>完整章节</span></div><div class="stat"><strong>${saved.correct.length}</strong><span>已掌握题目</span></div><div class="stat"><strong>${saved.wrong.length}</strong><span>待攻克错题</span></div></div><div class="actions"><button class="primary" id="random">全书随机 20 题</button><button class="secondary" id="retry" ${saved.wrong.length?'':'disabled'}>错题重练</button></div>${parts}<details><summary>答题规则与使用说明</summary><ul class="rules"><li>单选题选择一项；多选题需选全且不能多选。</li><li>每题答对得 100 分，连续答对最高额外奖励 50 分。</li><li>用 iPhone 或 iPad 的 Safari 打开，可添加到主屏幕。</li><li>错题和掌握进度仅保存在当前浏览器。</li></ul></details><p id="toast">${persist?'':'当前浏览器无法保存记录，本轮仍可正常答题。'}</p></section>`;app.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>start('chapter',Number(b.dataset.chapter)));document.getElementById('random').onclick=()=>start('random');document.getElementById('retry').onclick=()=>start('wrong');window.scrollTo(0,0)}
function start(kind,chapterNumber){mode=kind;if(kind==='chapter'){const c=chapters.find(x=>x.chapter===chapterNumber);queue=[...c.questions].map(q=>({...q,chapter:c.chapter,title:c.title,part:c.part}));label=`第${c.chapter}章 · ${c.title}`}else if(kind==='wrong'){queue=allBank.filter(q=>saved.wrong.includes(q.id));label='错题修炼'}else{queue=shuffle(allBank).slice(0,Math.min(20,allBank.length));label='全书随机挑战'}if(!queue.length)return;pos=0;points=0;streak=0;maxStreak=0;right=0;missed=[];show()}
function show(){selected=[];locked=false;const q=queue[pos],multi=q.a.length>1;app.innerHTML=`<section class="card"><div class="top"><span class="pill">${esc(label)} · ${pos+1}/${queue.length}</span><button class="tinybutton" id="exit">返回章节</button></div><div class="path" aria-label="已完成 ${pos} 题，共 ${queue.length} 题">${queue.map((_,i)=>`<span class="step ${i<pos?'done':i===pos?'now':''}"></span>`).join('')}</div><div class="top meta"><span>${multi?'多选题 · 选择所有正确项':'单选题 · 选择一项'}</span><span>★ ${points} 分 · 连对 ${streak}</span></div><h2 id="question">${esc(q.q)}</h2><div id="options" role="group" aria-labelledby="question">${q.o.map((o,i)=>`<button class="option" data-letter="${String.fromCharCode(65+i)}" aria-pressed="false"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="primary" id="submit" disabled>提交答案</button></div><p class="note">${esc(q.source||`第${q.chapter}章 · ${q.title}`)}</p></section>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b.dataset.letter));document.getElementById('submit').onclick=submit;document.getElementById('exit').onclick=()=>{if(confirm('返回章节选择将结束本轮，错题记录会保留。'))home()};window.scrollTo(0,0)}
function choose(letter){if(locked)return;const q=queue[pos];if(q.a.length===1)selected=[letter];else selected=selected.includes(letter)?selected.filter(x=>x!==letter):[...selected,letter];app.querySelectorAll('.option').forEach(b=>{const on=selected.includes(b.dataset.letter);b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});document.getElementById('submit').disabled=!selected.length}
function submit(){if(locked||!selected.length)return;locked=true;const q=queue[pos],ok=[...selected].sort().join('')===q.a;let gain=0;if(ok){right++;streak++;maxStreak=Math.max(maxStreak,streak);gain=100+Math.min(streak-1,5)*10;points+=gain;saved.wrong=saved.wrong.filter(id=>id!==q.id);if(!saved.correct.includes(q.id))saved.correct.push(q.id)}else{streak=0;missed.push(q.id);saved.correct=saved.correct.filter(id=>id!==q.id);if(!saved.wrong.includes(q.id))saved.wrong.push(q.id)}save();app.querySelectorAll('.option').forEach(b=>{b.disabled=true;const l=b.dataset.letter;b.classList.toggle('correct',q.a.includes(l));b.classList.toggle('wrong',selected.includes(l)&&!q.a.includes(l))});document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'miss'}"><h3>${ok?`✨ 答对啦！+${gain} 分`:'🌱 再巩固一下，下次就会了'}</h3><p><strong>正确答案：${q.a.split('').join('、')}</strong><br>你的选择：${[...selected].sort().join('、')}</p><p>${esc(q.why)}</p><p class="note">绿色标出正确项；红色标出误选项。${ok&&streak>1?`已连续答对 ${streak} 题！`:''}</p></div>`;const b=document.getElementById('submit');b.disabled=false;b.textContent=pos===queue.length-1?'领取闯关徽章':'下一题';b.onclick=()=>{if(pos===queue.length-1)finish();else{pos++;show()}}}
function finish(){saved.best=Math.max(saved.best,points);save();const rate=Math.round(right/queue.length*100),title=rate===100?'全对达人':rate>=80?'知识先锋':'成长探索者';app.innerHTML=`<section class="card result"><div class="medal" aria-hidden="true">${rate===100?'🏆':rate>=80?'🥇':'🌟'}</div><h2>${title}</h2><p>${esc(label)}完成，每一次练习都在进步。</p><div class="stats"><div class="stat"><strong>${points}</strong><span>本轮积分</span></div><div class="stat"><strong>${right}/${queue.length}</strong><span>答对题数 · ${rate}%</span></div><div class="stat"><strong>${maxStreak}</strong><span>最高连对</span></div></div><p>${missed.length?`本轮 ${missed.length} 道错题已加入错题本。`:'本轮全部答对，知识点已点亮！'}</p><div class="actions"><button class="primary" id="again">再来一局</button><button class="secondary" id="mistakes" ${saved.wrong.length?'':'disabled'}>错题重练（${saved.wrong.length}）</button><button class="secondary" id="home">选择章节</button></div></section>`;document.getElementById('again').onclick=()=>mode==='chapter'?start('chapter',queue[0].chapter):start(mode);document.getElementById('mistakes').onclick=()=>start('wrong');document.getElementById('home').onclick=home;window.scrollTo(0,0)}
home();
</script></body></html>
